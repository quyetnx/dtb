<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Warm ivory background -->
  <rect width="32" height="32" rx="6" fill="#faf9f5"/>

  <!-- Quill feather - right (wider) vane -->
  <path d="M7,26 C10,20 16,14 26,6 C24,10 21,14 20,19 C18,17 16,15 14,16 C11,18 8,22 7,26 Z"
        fill="#5d2e2e"/>

  <!-- Quill feather - left (thinner) vane for depth -->
  <path d="M7,26 C9,22 12,18 14,16 C12,13 9,10 6,7 C8,11 10,15 11,20 Z"
        fill="#7a3f3f"/>

  <!-- Shaft highlight -->
  <line x1="7" y1="26" x2="25" y2="7" stroke="#faf9f5" stroke-width="0.9" opacity="0.55" stroke-linecap="round"/>

  <!-- Nib -->
  <path d="M7,26 L4.5,29.5 L8,28 Z" fill="#3e1e1e"/>
</svg>
